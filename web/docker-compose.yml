services:
  drivvo-web:
    container_name: drivvo-web
    build:
      context: ..
      dockerfile: web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - '3000'
    networks:
      - drivvo-web-network
    restart: unless-stopped

networks:
  drivvo-web-network:
    external: true
